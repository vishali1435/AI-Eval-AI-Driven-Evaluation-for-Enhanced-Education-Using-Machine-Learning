<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Welcome to AI-Eval - Automated Paper Evaluation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 50%, #fce4ec 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .main-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    /* Welcome Banner Card (Figure 5.1 top) */
    .welcome-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 35px 45px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 100%;
      max-width: 440px;
    }
    .welcome-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #212529;
      margin-bottom: 25px;
    }
    .btn-orange-full {
      display: block;
      width: 100%;
      background: #f38120;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 15px;
      transition: all 0.25s ease;
      text-align: center;
    }
    .btn-orange-full:hover {
      background: #e27211;
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(243, 129, 32, 0.35);
      color: #fff;
    }
    .forms-row {
      display: flex;
      flex-wrap: wrap;
      gap: 35px;
      justify-content: center;
      width: 100%;
    }
    /* Login & Register Cards (Figure 5.1 bottom left & right) */
    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 35px 35px 30px 35px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
    }
    .auth-card h3 {
      font-size: 20px;
      font-weight: 700;
      color: #212529;
      text-align: center;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #495057;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-control-custom {
      width: 100%;
      padding: 10px 14px;
      font-size: 13.5px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control-custom:focus {
      border-color: #f38120;
    }
    .switch-link {
      text-align: center;
      font-size: 13px;
      color: #6c757d;
      margin-top: 15px;
    }
    .switch-link a {
      color: #007bff;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .switch-link a:hover {
      text-decoration: underline;
    }
    .flash-box {
      margin-bottom: 15px;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
    }
    .flash-danger { background: #ffebee; color: #c62828; }
    .flash-success { background: #e8f5e9; color: #2e7d32; }
    .footer-note {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="main-container">
    
    <!-- Welcome Header Card (Figure 5.1) -->
    <div class="welcome-card">
      <h2>Welcome to AI-Eval</h2>
      <button class="btn-orange-full" onclick="showAuth('login')">Login</button>
      <button class="btn-orange-full" onclick="showAuth('register')">Register</button>
      <a href="{{ url_for('home') }}" style="font-size:12.5px; color:#6c757d; text-decoration:none;">Explore Home Page &rarr;</a>
    </div>

    <!-- Flash message alerts -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-box flash-{{ category if category in ['danger', 'success'] else 'danger' }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="forms-row">
      <!-- Login Card (Figure 5.1 Left) -->
      <div class="auth-card" id="login-card">
        <h3>Login</h3>
        <form action="{{ url_for('login') }}" method="POST">
          <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-control-custom" placeholder="Enter your username" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control-custom" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn-orange-full" style="margin-top: 20px;">Login</button>
          <div class="switch-link">
            Don't have an account? <a onclick="showAuth('register')">Register</a>
          </div>
        </form>
      </div>

      <!-- Register Card (Figure 5.1 Right) -->
      <div class="auth-card" id="register-card">
        <h3>Register</h3>
        <form action="{{ url_for('register') }}" method="POST">
          <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-control-custom" placeholder="Choose a username" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control-custom" placeholder="Create a password" required>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control-custom" placeholder="Confirm your password" required>
          </div>
          <div class="form-group">
            <label>User Type</label>
            <select name="user_type" class="form-control-custom">
              <option value="Student" selected>Student</option>
              <option value="Teacher">Teacher</option>
            </select>
          </div>
          <button type="submit" class="btn-orange-full" style="margin-top: 20px;">Register</button>
          <div class="switch-link">
            Already have an account? <a onclick="showAuth('login')">Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function showAuth(type) {
      const loginCard = document.getElementById('login-card');
      const registerCard = document.getElementById('register-card');
      if (type === 'login') {
        loginCard.scrollIntoView({ behavior: 'smooth' });
        loginCard.querySelector('input').focus();
      } else {
        registerCard.scrollIntoView({ behavior: 'smooth' });
        registerCard.querySelector('input').focus();
      }
    }
  </script>

</body>
</html>
