<!DOCTYPE html>
<html>
<head>
  <title>Chatbot Interface</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    #chat-box { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll; margin-bottom: 10px; }
    #user-input { width: 70%; padding: 5px; }
    button { padding: 5px 10px; }
  </style>
</head>
<body>

  <h2>Paper Evaluation Chatbot</h2>
  <div id="chat-box" style="height:220px"></div>
  <input type="text" id="user-input" placeholder="Ask something..." />
  <button onclick="sendMessage()">Send</button>
                                           <!-- /chatbot -->
                                           <div id="chatbot-widget" style="display:none; position:fixed; bottom:20px; right:20px; width:350px; height:500px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.2); overflow:hidden; z-index:9999; background:white;">
                                            <div style="display:flex; justify-content:space-between; align-items:center; background:#007bff; color:white; padding:10px;">
                                              <span>Chatbot</span>
                                              <button onclick="toggleChatbot()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;">&times;</button>
                                            </div>
                                            <iframe id="chatbot-frame" src="http://127.0.0.1:5000" width="100%" height="100%" frameborder="0" style="border:none;"></iframe>
                                          </div>
                                          

  <script>
    function sendMessage() {
      const input = document.getElementById("user-input");
      const message = input.value;
      fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message })
      })
      .then(res => res.json())
      .then(data => {
        const chatBox = document.getElementById("chat-box");
        chatBox.innerHTML += `<div><strong>You:</strong> ${message}</div>`;
        chatBox.innerHTML += `<div><strong>Bot:</strong> ${data.reply}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        input.value = '';
      });
    }
  </script>
  <script>
    function toggleChatbot() {
      const widget = document.getElementById("chatbot-widget");
      widget.style.display = widget.style.display === "none" ? "block" : "none";
    }
  </script>
  

</body>
</html>
